<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070817">
<title>Blip AI Arena</title>
<style>
:root{color-scheme:dark;--bg:#070817;--panel:#111329;--line:#292d50;--muted:#a2a7c7;--purple:#8b5cf6;--blue:#4f8cff;--green:#34d399}
*{box-sizing:border-box}
html{visibility:hidden}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#202052 0,transparent 38%),radial-gradient(circle at 90% 80%,#30164d 0,transparent 36%),var(--bg);color:#f7f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:18px}
main{max-width:980px;margin:auto}
a{color:#c4b5fd;text-decoration:none}
header{text-align:center;padding:18px 0 24px}
.kicker{font-size:11px;letter-spacing:.28em;color:#a5b4fc;font-weight:800}
h1{font-size:clamp(30px,7vw,54px);margin:8px 0;background:linear-gradient(90deg,#a5b4fc,#e9d5ff,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:var(--muted);line-height:1.6;margin:0 auto;max-width:620px}
.panel{background:#101329eF;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 16px 42px #0004}
label{display:block;font-size:13px;font-weight:700;margin-bottom:9px}
textarea{width:100%;min-height:120px;resize:vertical;background:#080b1b;color:#fff;border:1px solid #34395f;border-radius:13px;padding:14px;font:inherit;line-height:1.55;outline:none}
textarea:focus{border-color:#9b8cff;box-shadow:0 0 0 3px #8b5cf622}
button{border:0;border-radius:12px;padding:12px 16px;font:700 14px system-ui;cursor:pointer;color:#fff;background:linear-gradient(110deg,#6366f1,#9333ea)}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{width:100%;margin-top:12px;padding:14px}
.message{min-height:22px;color:var(--muted);font-size:13px;margin-top:10px;white-space:pre-wrap}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.model{min-width:0;background:#0b0e20;border:1px solid var(--line);border-radius:16px;padding:15px}
.model h2{font-size:16px;margin:0 0 6px;overflow-wrap:anywhere}
.meta{color:#a5b4fc;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.answer{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:14px;margin:14px 0;min-height:90px}
.vote-row{display:flex;gap:8px;flex-wrap:wrap}
.vote-row button{flex:1;min-width:90px;font-size:12px}
.vote-row .tie{background:#343957}
h3{margin:0 0 12px;font-size:18px}
.rank-row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:12px;align-items:center}
.rank-name{overflow-wrap:anywhere}
.small{color:var(--muted);font-size:11px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:14px}
@media(max-width:680px){body{padding:10px}.results{grid-template-columns:1fr}.panel{padding:14px}.rank-row{grid-template-columns:1fr auto auto}.rank-row .ties{display:none}}
</style>
</head>
<body>
<main>
<header>
<div class="kicker">BLIP MULTIVERSE · EXPERIMENT 001</div>
<h1>AI ARENA</h1>
<p class="subtitle">Bir savol. Ikki AI. Ikki mustaqil javob. Javoblarni o‘qib, qaysi biri foydaliroq ekaniga ovoz bering.</p>
</header>

<section class="panel">
<label for="prompt">Savolingiz</label>
<textarea id="prompt" maxlength="1600" placeholder="Masalan: Python dasturlash tilini yangi boshlovchiga qanday o‘rganishni tavsiya qilasan?"></textarea>
<button class="primary" id="compareBtn" type="button">⚡ IKKALA AI’NI SOLISHTIRISH</button>
<div class="message" id="status" role="status"></div>
</section>

<section class="results" id="results" aria-live="polite"></section>

<section class="panel" id="leaderboardPanel">
<h3>🏆 Arena reytingi</h3>
<div id="leaderboard"><p class="small">Reyting yuklanmoqda...</p></div>
</section>

<footer><a href="multiverse.html">← Multiverse’ga qaytish</a> · Blip</footer>
</main>
<script>
const API = "https://saytim-uchun.onrender.com";
const $ = id => document.getElementById(id);
let currentMatchId = null;
let hasVoted = false;

function authHeaders(){
 const headers={"Content-Type":"application/json"};
 const token=sessionStorage.getItem("blip_jwt");
 if(token) headers.Authorization="Bearer "+token;
 return headers;
}

(async function guard(){
 try{
  const response=await fetch(API+"/api/me",{headers:authHeaders(),credentials:"include",cache:"no-store"});
  if(response.status===401||response.status===403){
   sessionStorage.removeItem("blip_jwt");
   sessionStorage.removeItem("blip_role");
   location.replace("index.html");
   return;
  }
  if(!response.ok) throw new Error("Auth check failed");
  document.documentElement.style.visibility="visible";
 }catch(_){location.replace("index.html?auth_error=unavailable");}
})();

function setStatus(message){$("status").textContent=message||"";}

function renderModel(slot,data,matchId){
 const card=document.createElement("article");card.className="model";
 const title=document.createElement("h2");title.textContent=data.provider+" · "+data.model;
 const meta=document.createElement("div");meta.className="meta";meta.textContent="Javob vaqti: "+data.latency_ms+" ms";
 const answer=document.createElement("p");answer.className="answer";answer.textContent=data.answer;
 const votes=document.createElement("div");votes.className="vote-row";
 const voteButton=(label,value,extra)=>{
  const btn=document.createElement("button");btn.type="button";btn.textContent=label;if(extra)btn.className=extra;
  btn.disabled=!matchId;
  btn.addEventListener("click",()=>sendVote(value));return btn;
 };
 if(slot==="a") votes.append(voteButton("🏆 Shu javob yaxshi","a"),voteButton("🤝 Teng","tie","tie"));
 else votes.append(voteButton("🏆 Shu javob yaxshi","b"));
 card.append(title,meta,answer,votes);return card;
}

async function compare(){
 const prompt=$("prompt").value.trim();
 if(prompt.length<3){setStatus("Iltimos, kamida 3 ta belgidan iborat savol yozing.");return;}
 $("compareBtn").disabled=true;$("results").replaceChildren();currentMatchId=null;hasVoted=false;
 setStatus("⏳ Ikkala AI bir vaqtda javob tayyorlamoqda...");
 try{
  const response=await fetch(API+"/api/arena/compare",{method:"POST",headers:authHeaders(),credentials:"include",body:JSON.stringify({prompt})});
  const data=await response.json();
  if(!response.ok||!data.success){
   const details=data.results?Object.values(data.results).filter(x=>x&&!x.success).map(x=>x.provider+": "+x.error).join("\n"):"";
   throw new Error([data.error||"AI Arena xatosi",details].filter(Boolean).join("\n"));
  }
  currentMatchId=data.match_id||null;
  $("results").append(renderModel("a",data.results.a,currentMatchId),renderModel("b",data.results.b,currentMatchId));
  setStatus(data.message||"Javoblar tayyor. Ikkalasini o‘qib, pastdagi tugmalar orqali ovoz bering.");
  if(!currentMatchId)setStatus((data.message||"")+"\nOvoz berish hozircha vaqtincha ishlamaydi.");
  loadLeaderboard();
 }catch(error){setStatus("❌ "+error.message);}
 finally{$("compareBtn").disabled=false;}
}

async function sendVote(winner){
 if(!currentMatchId||hasVoted)return;
 document.querySelectorAll(".vote-row button").forEach(button=>button.disabled=true);
 try{
  const response=await fetch(API+"/api/arena/vote",{method:"POST",headers:authHeaders(),credentials:"include",body:JSON.stringify({match_id:currentMatchId,winner})});
  const data=await response.json();
  if(!response.ok||!data.success)throw new Error(data.error||"Ovoz saqlanmadi");
  hasVoted=true;setStatus(data.message||"Ovozingiz saqlandi.");
  loadLeaderboard();
 }catch(error){
  document.querySelectorAll(".vote-row button").forEach(button=>button.disabled=false);
  setStatus("❌ "+error.message);
 }
}

async function loadLeaderboard(){
 try{
  const response=await fetch(API+"/api/arena/leaderboard",{headers:authHeaders(),credentials:"include"});
  const data=await response.json();
  if(!response.ok||!data.success)throw new Error(data.error||"Reyting yuklanmadi");
  const root=$("leaderboard");root.replaceChildren();
  if(!data.ranking.length){const empty=document.createElement("p");empty.className="small";empty.textContent="Hozircha ovozlar yo‘q. Birinchi bo‘lib ovoz bering!";root.append(empty);return;}
  data.ranking.forEach((item,index)=>{
   const row=document.createElement("div");row.className="rank-row";
   const name=document.createElement("span");name.className="rank-name";name.textContent=(index+1)+". "+item.model_a+" VS "+item.model_b;
   const a=document.createElement("span");a.textContent="A: "+item.a;
   const b=document.createElement("span");b.textContent="B: "+item.b;
   const tie=document.createElement("span");tie.className="ties";tie.textContent="Teng: "+item.tie;
   row.append(name,a,b,tie);root.append(row);
  });
 }catch(error){$("leaderboard").textContent=error.message;}
}

$("compareBtn").addEventListener("click",compare);
loadLeaderboard();
</script>
</body>
</html>
