<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blip Multiverse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050510;--card:#0f0f22;--text:#e6e6f0;--muted:#8888aa;--acc:#6366f1;--acc2:#a855f7;--brd:#1f1f3a;--gold:#fbbf24;--red:#ef4444;--grn:#10b981;--pnk:#ec4899;--cyan:#06b6d4}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;background-image:radial-gradient(circle at 15% 15%,rgba(99,102,241,.15),transparent 40%),radial-gradient(circle at 85% 85%,rgba(168,85,247,.15),transparent 40%);background-attachment:fixed}
.c{max-width:800px;margin:auto}
header{text-align:center;padding:24px 0 16px}
h1{font-size:32px;font-weight:900;background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899,#f59e0b,#6366f1);background-size:400% 400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:grad 6s ease infinite}
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sub{color:var(--muted);margin-top:6px;font-size:13px}
.lang-switch{display:flex;gap:3px;background:var(--card);padding:4px;border-radius:10px;border:1px solid var(--brd);justify-content:center;margin:8px auto 16px;width:fit-content}
.lang-btn{padding:5px 9px;border:none;border-radius:7px;cursor:pointer;background:transparent;color:var(--muted);font-weight:700;font-size:11px;transition:all .2s;font-family:inherit}
.lang-btn:hover{color:var(--text)}
.lang-btn.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--brd);margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;cursor:pointer;background:var(--card);border:1px solid var(--brd);color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;transition:all .2s}
.tab.active{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.tab:hover{color:var(--text)}
.tc{display:none;animation:fade .3s ease}
.tc.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:16px;margin-bottom:14px}
.gc{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:20px;margin-bottom:12px;cursor:pointer;transition:all .3s}
.gc:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 16px 32px rgba(99,102,241,.25)}
.gc .i{font-size:36px;display:block;margin-bottom:10px}
.gc h3{font-size:17px;margin-bottom:6px}
.gc p{font-size:13px;color:var(--muted);line-height:1.6}
.tag{display:inline-block;margin-top:10px;font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(236,72,153,.2);color:var(--pnk);border:1px solid var(--pnk)}
.tag.new{background:rgba(16,185,129,.15);color:var(--grn);border-color:var(--grn)}
.tag.voice{background:rgba(6,182,212,.15);color:var(--cyan);border-color:var(--cyan)}
.tag.ai{background:rgba(251,191,36,.15);color:var(--gold);border-color:var(--gold)}
textarea,input[type="text"],input[type="number"],select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--brd);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:10px}
textarea{resize:vertical;min-height:90px}
textarea:focus,input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.btn{padding:12px 20px;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:700;font-size:14px;transition:all .25s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-full{width:100%}
.btn-gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn-row .btn{flex:1;min-width:120px}
.mic{background:var(--card);border:1px solid var(--brd);color:var(--text);padding:12px 16px;border-radius:10px;cursor:pointer;font-size:18px}
.mic:hover{border-color:var(--pnk)}
.mic.rec{background:var(--pnk);color:#fff;border-color:var(--pnk);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.result{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:16px;margin-bottom:14px;animation:fade .5s ease;border-left:4px solid var(--acc)}
.result img{width:100%;border-radius:12px;margin-top:10px;border:1px solid var(--brd)}
.result-title{font-size:16px;font-weight:800;color:var(--acc);margin-bottom:10px}
.result-text{font-size:14px;line-height:1.7;white-space:pre-wrap}
.loading{text-align:center;padding:30px;color:var(--muted);font-size:14px}
.dots::after{content:'...';animation:dots 1.5s steps(4) infinite}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}
.info{background:rgba(99,102,241,.1);border:1px solid var(--acc);border-radius:12px;padding:12px;font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.footer{text-align:center;padding:20px;color:var(--muted);font-size:11px;margin-top:20px}
.footer a{color:var(--acc);text-decoration:none}
.lbl{display:block;font-size:11px;color:var(--muted);margin:10px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.lbl .req{color:var(--red)}
input[type="file"]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--brd);background:var(--bg);color:var(--text);font-size:13px;margin-bottom:8px}
input[type="file"]::file-selector-button{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;margin-right:10px;font-family:inherit}
input[type="file"]::file-selector-button:hover{opacity:.9}
.m-item{background:var(--bg);border:1px solid var(--brd);border-radius:12px;padding:14px;margin-bottom:12px;position:relative}
.m-item audio,.m-item video{width:100%;margin-top:8px;border-radius:8px}
.m-item .m-artist{font-size:15px;font-weight:800;margin-bottom:4px;padding-right:40px;word-break:break-word}
.m-item .m-song{font-size:13px;color:var(--acc2);margin-bottom:6px;word-break:break-word}
.m-item .m-del{position:absolute;top:12px;right:12px;background:transparent;border:1px solid var(--red);color:var(--red);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700}
.m-item .m-yt{display:inline-block;margin-top:8px;text-decoration:none;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700}
.ff-line{font-size:13px;line-height:1.8;padding:8px 0;border-bottom:1px dashed var(--brd)}
.ff-line b{color:var(--gold)}
.ff-line:last-child{border:none}
.ff-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(16,185,129,.15);color:var(--grn);border:1px solid var(--grn);margin-left:6px}
.ff-tips{margin:8px 0 0 18px;font-size:12px;line-height:1.8;color:var(--muted)}
.canvas-wrap{background:#000;border-radius:12px;overflow:hidden;margin-bottom:12px;text-align:center}
#vcanvas{max-width:100%;height:auto;display:block;margin:auto}
.auto-note{margin-top:6px!important;animation:fade .3s ease}
@media(max-width:600px){h1{font-size:24px}.c{padding:6px}body{padding:8px}}
</style>
</head>

  const t = T[l];
  if(!t) return;

  // Subtitle
  const st = document.getElementById('subTitle');
  if(st) st.textContent = t.sub;

  // Tab nomlari
  document.querySelectorAll('.tabs .tab span').forEach(s => {
    const key = s.className.replace('t-','');
    if(t.tabs[key]) s.textContent = t.tabs[key];
  });

  // Home kartochkalar
  for(let i = 1; i <= 9; i++){

function sw(id, el){
  document.querySelectorAll('.tc').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

  const c = document.getElementById('t-' + id);
  if(c) c.classList.add('active');

  if(el) el.classList.add('active');
  else {
    const tab = document.getElementById('tab-' + id);
    if(tab) tab.classList.add('active');
  }

  window.scrollTo({top:0, behavior:'smooth'});
}

function mic(inputId, btnId){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Brauzer ovozni qo\'llab-quvvatlamaydi'); return; }

  const btn = document.getElementById(btnId);
  const inp = document.getElementById(inputId);

  if(isR){
    isR = false;
    if(rec) rec.stop();
    btn.classList.remove('rec');
    return;
  }

  rec = new SR();
  rec.lang = lang === 'uz' ? 'uz-UZ' : lang === 'ru' ? 'ru-RU' : lang === 'tj' ? 'tg-TJ' : 'en-US';
  rec.continuous = false;
  rec.interimResults = false;

  rec.onstart = () => { isR = true; btn.classList.add('rec'); };
  rec.onend   = () => { isR = false; btn.classList.remove('rec'); };
  rec.onerror = () => { isR = false; btn.classList.remove('rec'); };
  rec.onresult = e => {
    const txt = e.results[0][0].transcript;
    inp.value = (inp.value ? inp.value + ' ' : '') + txt;
  };

  rec.start();
}

async function aiCall(prompt, sys){
  try{
    const r = await fetch(API + '/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ prompt, sys, password: P })
    });
    if(!r.ok) throw new Error('API ' + r.status);
    const d = await r.json();
    return d.reply || d.text || d.message || d.response || '—';
  }catch(e){
    return '⚠️ Xatolik: ' + e.message;
  }
}

function showResult(boxId, title, text, img){
  const box = document.getElementById(boxId);
  if(!box) return;
  box.innerHTML = `
    <div class="result">
      <div class="result-title">${title}</div>
      <div class="result-text">${text || ''}</div>
      ${img ? `<img src="${img}" alt="" loading="lazy">` : ''}
    </div>
  `;
}

function showLoading(boxId, msg){
  const box = document.getElementById(boxId);
  if(!box) return;
  box.innerHTML = `<div class="loading"><span class="dots">${msg}</span></div>`;
}

function speak(txt){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = lang === 'uz' ? 'uz-UZ' : lang === 'ru' ? 'ru-RU' : lang === 'tj' ? 'tg-TJ' : 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function speakAll(){
  if(!courtData) return;
  speak(courtData.adv + '. ' + courtData.pros + '. ' + courtData.judge);
}

let mFiles = [];

function mUpload(){
  const t = T[lang];
  const aIn = document.getElementById('mAudio');
  const vIn = document.getElementById('mVideo');
  const audio = aIn.files[0];

  if(!audio){ alert(t.mErrNoFile); return; }

  const artist  = (document.getElementById('mArtist').value || '').trim();
  const surname = (document.getElementById('mSurname').value || '').trim();
  const song    = (document.getElementById('mSong').value || '').trim();
  const yt      = (document.getElementById('mYt').value || '').trim();

  if(!artist){ alert(t.mErrNoArtist); return; }

  // YouTube link normalizatsiya
  let ytLink = '';
  if(yt){
    if(/youtube\.com|youtu\.be/.test(yt)) ytLink = yt;
    else if(/^[\w-]{11}$/.test(yt)) ytLink = 'https://youtube.com/watch?v=' + yt;
    else ytLink = yt;
  }

  const reader = new FileReader();
  reader.onload = e => {
    mFiles.push({
      id: Date.now(),
      artist, surname, song,
      yt: ytLink,
      name: audio.name,
      data: e.target.result,
      video: null
    });
    renderMedia();
    ['mArtist','mSurname','mSong','mYt'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.value = '';
    });
    aIn.value = '';
  };
  reader.readAsDataURL(audio);

  if(vIn && vIn.files[0]){
    const vr = new FileReader();
    vr.onload = e => {
      if(mFiles.length){
        mFiles[mFiles.length-1].video = { name: vIn.files[0].name, data: e.target.result };
        renderMedia();
        vIn.value = '';
        document.getElementById('mVideoChk').checked = false;
        vIn.disabled = true;
      }
    };
    vr.readAsDataURL(vIn.files[0]);
  }
}

function renderMedia(){
  const t = T[lang];
  const box = document.getElementById('mList');
  if(!box) return;

  if(!mFiles.length){
    box.innerHTML = `<p style="color:var(--muted);font-size:13px">${t.mEmpty}</p>`;
    return;
  }

  box.innerHTML = mFiles.map(f => {
    const fullName = f.surname ? `${f.artist} ${f.surname}` : f.artist;
    return `
      <div class="m-item">
        <button class="m-del" onclick="mDel(${f.id})">🗑</button>
        <div class="m-artist">🎤 ${escapeHtml(fullName)}</div>
        ${f.song ? `<div class="m-song">🎵 ${escapeHtml(f.song)}</div>` : ''}
        <audio controls src="${f.data}"></audio>
        ${f.yt ? `<a href="${f.yt}" target="_blank" rel="noopener" class="m-yt">${t.mYtBtn}</a>` : ''}
        ${f.video ? `<div class="m-song" style="margin-top:8px">🎬 ${escapeHtml(f.video.name)}</div><video controls src="${f.video.data}"></video>` : ''}
      </div>
    `;
  }).join('');
}

function mDel(id){
  mFiles = mFiles.filter(f => f.id !== id);
  renderMedia();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function autoDetectPhone(){
  const t = T[lang];
  const ua = navigator.userAgent;
  let model = '', ram = '', chip = '';

  const androidMatch = ua.match(/Android[^;]*;\s*([^)]+?)(?:\s+Build|\))/i);
  if(androidMatch){
    model = androidMatch[1].replace(/;.*/, '').trim();
    model = model.replace(/\b(wv|Mobile|Build)\b/gi, '').trim();
  }
  if(/iPhone/.test(ua)) model = 'iPhone';
  else if(/iPad/.test(ua)) model = 'iPad';
  else if(/Macintosh/.test(ua)) model = 'Mac';

  if(navigator.deviceMemory) ram = navigator.deviceMemory + 'GB';
  if(navigator.hardwareConcurrency) chip = navigator.hardwareConcurrency + ' yadro';

  if(model) document.getElementById('ffModel').value = model;
  if(ram)   document.getElementById('ffRam').value = ram;
  if(chip && !document.getElementById('ffChip').value) document.getElementById('ffChip').value = chip;

  if(!model && !ram){
    alert(t.ffNotFound);
    return;
  }

  const note = document.createElement('div');
  note.className = 'info auto-note';
  note.textContent = t.ffDetected + [model, ram].filter(Boolean).join(' · ');
  const parent = document.getElementById('ffModel').parentElement;
  const old = parent.querySelector('.auto-note');
  if(old) old.remove();
  parent.appendChild(note);
  setTimeout(() => note.remove(), 5000);
}

let vRecorder = null, vChunks = [], vBlob = null;

const THEMES = {
  dark:   {bg:'#050510', fg:'#e6e6f0', acc:'#6366f1'},
  gold:   {bg:'#1a1208', fg:'#fde68a', acc:'#fbbf24'},
  blue:   {bg:'#041428', fg:'#dbeafe', acc:'#3b82f6'},
  purple: {bg:'#150528', fg:'#e9d5ff', acc:'#a855f7'},
  sunset: {bg:'#2a0e0e', fg:'#fed7aa', acc:'#f97316'}
};

async function vStart(){
  const t = T[lang];
  const text = document.getElementById('vtext').value.trim();
  if(!text){ alert(t.vNoText); return; }

  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  if(!lines.length){ alert(t.vNoScenes); return; }

  const theme = document.getElementById('vtheme').value;
  const dur = parseInt(document.getElementById('vdur').value) || 3;
  const size = document.getElementById('vsize').value;
  const [w, h] = size.split('x').map(Number);

  const canvas = document.getElementById('vcanvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  const col = THEMES[theme] || THEMES.dark;

  const stream = canvas.captureStream(30);
  vChunks = [];
  vRecorder = new MediaRecorder(stream, {mimeType:'video/webm;codecs=vp9'});
  vRecorder.ondataavailable = e => { if(e.data.size) vChunks.push(e.data); };
  vRecorder.onstop = () => {
    vBlob = new Blob(vChunks, {type:'video/webm'});
    document.getElementById('vdownload').style.display = 'block';
    document.getElementById('vstatus').style.display = 'none';
  };
  vRecorder.start();

  document.getElementById('vstatus').style.display = 'block';
  document.getElementById('vstatus').innerHTML = `<span class="dots">${t.vRecording}</span>`;
  document.getElementById('vdownload').style.display = 'none';

  const fps = 30;
  const frames = dur * fps;

  for(let i = 0; i < lines.length; i++){
    const line = lines[i];
    for(let f = 0; f < frames; f++){
      const prog = f / frames;

      ctx.fillStyle = col.bg;
      ctx.fillRect(0, 0, w, h);

      ctx.globalAlpha = 0.15 + Math.sin(prog * Math.PI) * 0.15;
      ctx.fillStyle = col.acc;
      ctx.beginPath();
      ctx.arc(w * (0.2 + prog * 0.6), h * (0.3 + Math.sin(prog * Math.PI * 2) * 0.2), w * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      const fontSize = Math.floor(Math.min(w, h) * 0.07);
      ctx.font = `bold ${fontSize}px system-ui, sans-serif`;
      ctx.fillStyle = col.fg;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const maxW = w * 0.85;
      const words = line.split(' ');
      const rows = [];
      let cur = '';
      for(const word of words){
        const test = cur ? cur + ' ' + word : word;
        if(ctx.measureText(test).width > maxW){
          if(cur) rows.push(cur);
          cur = word;
        } else cur = test;
      }
      if(cur) rows.push(cur);

      const lineH = fontSize * 1.3;
      const startY = h / 2 - (rows.length - 1) * lineH / 2;

      const alpha = prog < 0.15 ? prog / 0.15 : prog > 0.85 ? (1 - prog) / 0.15 : 1;
      ctx.globalAlpha = alpha;
      rows.forEach((row, idx) => ctx.fillText(row, w / 2, startY + idx * lineH));
      ctx.globalAlpha = 1;

      ctx.font = `${Math.floor(fontSize * 0.35)}px system-ui`;
      ctx.fillStyle = col.acc;
      ctx.globalAlpha = 0.6;
      ctx.fillText(`${i+1}/${lines.length}`, w - 60, h - 40);
      ctx.globalAlpha = 1;

      await new Promise(r => setTimeout(r, 1000 / fps));
    }
  }

  await new Promise(r => setTimeout(r, 500));
  if(vRecorder && vRecorder.state !== 'inactive') vRecorder.stop();

  document.getElementById('vstatus').innerHTML = t.vReady;
  setTimeout(() => { document.getElementById('vstatus').style.display = 'none'; }, 2000);
}

function vDownload(){
  if(!vBlob) return;
  const url = URL.createObjectURL(vBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'blip-video-' + Date.now() + '.webm';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
    }
