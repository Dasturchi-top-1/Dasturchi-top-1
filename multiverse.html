<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050510;--card:#0f0f22;--text:#e6e6f0;--muted:#8888aa;--acc:#6366f1;--acc2:#a855f7;--brd:#1f1f3a;--gold:#fbbf24;--red:#ef4444;--grn:#10b981;--pnk:#ec4899;--cyan:#06b6d4}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;background-image:radial-gradient(circle at 15% 15%,rgba(99,102,241,.15),transparent 40%),radial-gradient(circle at 85% 85%,rgba(168,85,247,.15),transparent 40%);background-attachment:fixed}
.c{max-width:800px;margin:auto}
header{text-align:center;padding:24px 0 16px}
h1{font-size:32px;font-weight:900;background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899,#f59e0b,#6366f1);background-size:400% 400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:grad 6s ease infinite}
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sub{color:var(--muted);margin-top:6px;font-size:13px}
.lang-switch{display:flex;gap:3px;background:var(--card);padding:4px;border-radius:10px;border:1px solid var(--brd);justify-content:center;margin:8px auto 16px;width:fit-content}
.lang-btn{padding:5px 9px;border:none;border-radius:7px;cursor:pointer;background:transparent;color:var(--muted);font-weight:700;font-size:11px;transition:all .2s;font-family:inherit}
.lang-btn:hover{color:var(--text)}
.lang-btn.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--brd);margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;cursor:pointer;background:var(--card);border:1px solid var(--brd);color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;transition:all .2s}
.tab.active{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.tab:hover{color:var(--text)}
.tc{display:none;animation:fade .3s ease}
.tc.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:16px;margin-bottom:14px}
.gc{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:20px;margin-bottom:12px;cursor:pointer;transition:all .3s}
.gc:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 16px 32px rgba(99,102,241,.25)}
.gc .i{font-size:36px;display:block;margin-bottom:10px}
.gc h3{font-size:17px;margin-bottom:6px}
.gc p{font-size:13px;color:var(--muted);line-height:1.6}
.tag{display:inline-block;margin-top:10px;font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(236,72,153,.2);color:var(--pnk);border:1px solid var(--pnk)}
.tag.new{background:rgba(16,185,129,.15);color:var(--grn);border-color:var(--grn)}
.tag.voice{background:rgba(6,182,212,.15);color:var(--cyan);border-color:var(--cyan)}
textarea,input[type="text"],input[type="number"],select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--brd);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:10px}
textarea{resize:vertical;min-height:90px}
textarea:focus,input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.btn{padding:12px 20px;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:700;font-size:14px;transition:all .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-full{width:100%}
.btn-sec{background:var(--card);border:1px solid var(--brd);color:var(--text)}
.btn-sec:hover{background:#15152d;border-color:var(--acc)}
.btn-gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn-row .btn{flex:1;min-width:120px}
.mic{background:var(--card);border:1px solid var(--brd);color:var(--text);padding:12px 16px;border-radius:10px;cursor:pointer;font-size:18px}
.mic:hover{border-color:var(--pnk)}
.mic.rec{background:var(--pnk);color:#fff;border-color:var(--pnk);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.result{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:16px;margin-bottom:14px;animation:fade .5s ease;border-left:4px solid var(--acc)}
.result img{width:100%;border-radius:12px;margin-top:10px;border:1px solid var(--brd)}
.result-title{font-size:16px;font-weight:800;color:var(--acc);margin-bottom:10px}
.result-text{font-size:14px;line-height:1.7;white-space:pre-wrap}
.symbols{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.symbols span{background:rgba(168,85,247,.2);border:1px solid var(--acc);padding:3px 10px;border-radius:999px;font-size:11px;color:var(--acc2)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.answer{background:var(--bg);border:1.5px solid var(--brd);border-radius:12px;padding:12px}
.answer-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:700}
.answer-text{font-size:13px;line-height:1.6;white-space:pre-wrap}
.verdict{text-align:center;padding:16px;border-radius:14px;margin-bottom:14px}
.verdict.win{background:rgba(16,185,129,.15);border:2px solid var(--grn)}
.verdict.lose{background:rgba(239,68,68,.15);border:2px solid var(--red)}
.verdict.gold{background:rgba(251,191,36,.15);border:2px solid var(--gold)}
.verdict-title{font-size:20px;font-weight:800;margin-bottom:6px}
.verdict-text{font-size:13px;line-height:1.6}
.loading{text-align:center;padding:30px;color:var(--muted);font-size:14px}
.dots::after{content:'...';animation:dots 1.5s steps(4) infinite}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}
.info{background:rgba(99,102,241,.1);border:1px solid var(--acc);border-radius:12px;padding:12px;font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.footer{text-align:center;padding:20px;color:var(--muted);font-size:11px;margin-top:20px}
.footer a{color:var(--acc);text-decoration:none}
.debate-role{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap;padding-bottom:6px;border-bottom:1px solid var(--brd)}
.debate-role-title{font-size:13px;font-weight:800}
.debate-text{font-size:13px;line-height:1.7;white-space:pre-wrap}
.btn-mini{background:transparent;border:1px solid var(--brd);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;transition:all .25s}
.btn-mini:hover{border-color:var(--acc);color:var(--acc)}
.btn-mini.red{border-color:var(--red);color:var(--red)}
.btn-mini.grn{border-color:var(--grn);color:var(--grn)}
.btn-mini.gold{border-color:var(--gold);color:var(--gold)}
.advocate-card{background:rgba(16,185,129,.08);border:1.5px solid var(--grn);border-radius:14px;padding:14px;margin-bottom:10px}
.prosecutor-card{background:rgba(239,68,68,.08);border:1.5px solid var(--red);border-radius:14px;padding:14px;margin-bottom:10px}
.judge-card{background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(168,85,247,.12));border:2px solid var(--gold);border-radius:14px;padding:16px;margin-bottom:14px}
.speech-active{background:var(--grn) !important;color:#fff !important}
.canvas-wrap{background:#000;border-radius:12px;overflow:hidden;margin-bottom:12px;text-align:center}
#vcanvas{max-width:100%;height:auto;display:block;margin:auto}
@media(max-width:600px){h1{font-size:24px}.answers{grid-template-columns:1fr}.c{padding:6px}body{padding:8px}}
</style>
</head>

// ============================================================
let voices=[];
function loadVoices(){ if(!window.speechSynthesis)return; const v=window.speechSynthesis.getVoices(); if(v&&v.length) voices=v; }
loadVoices();
if(window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged=loadVoices;
  setTimeout(loadVoices,100);
  setTimeout(loadVoices,500);
  setTimeout(loadVoices,1000);
  setTimeout(loadVoices,2000);
}

function tanlaOvoz(tur){
  if(!voices.length) loadVoices();
  const all=voices;
  if(!all.length) return null;
  const byLang=l=>all.filter(v=>v.lang.toLowerCase().startsWith(l));
  const uz=byLang('uz'),tr=byLang('tr'),ru=byLang('ru'),en=byLang('en');
  if(tur==='advocate') return uz[0]||tr[0]||en[0]||all[0];
  if(tur==='prosecutor') return ru[0]||en[1]||en[0]||all[1]||all[0];
  if(tur==='judge') return en[2]||ru[1]||en[0]||all[2]||all[0];
  return all[0];
}

function splitText(text,max){
  max=max||180;
  const parts=[]; let current='';
  const sentences=text.split(/(?<=[.!?])\s+/);
  for(const s of sentences){
    if((current+' '+s).length>max){ if(current) parts.push(current.trim()); current=s; }
    else current+=' '+s;
  }
  if(current) parts.push(current.trim());
  return parts.length?parts:[text];
}

function makeUtter(text,tur){
  const u=new SpeechSynthesisUtterance(text);
  const v=tanlaOvoz(tur);
  if(v) u.voice=v;
  u.lang=v?v.lang:'en-US';
  u.rate=tur==='judge'?0.95:1.0;
  u.pitch=tur==='advocate'?1.2:tur==='prosecutor'?0.8:1.0;
  u.volume=1;
  return u;
}

function speak(text,tur){
  if(!window.speechSynthesis){ alert('❌ Ovoz qo\'llab-quvvatlanmaydi'); return; }
  window.speechSynthesis.cancel();
  const parts=splitText(text);
  let i=0;
  function next(){
    if(i>=parts.length) return;
    const u=makeUtter(parts[i],tur);
    u.onend=()=>{i++;next();};
    u.onerror=()=>{i++;next();};
    window.speechSynthesis.speak(u);
  }
  next();
}

function speakSeq(text,tur){
  return new Promise(resolve=>{
    if(!window.speechSynthesis){ resolve(); return; }
    const parts=splitText(text);
    let i=0;
    function next(){
      if(i>=parts.length){ resolve(); return; }
      const u=makeUtter(parts[i],tur);
      u.onend=()=>{i++;next();};
      u.onerror=()=>{i++;next();};
      window.speechSynthesis.speak(u);
    }
    next();
  });
}

  function resetBtn(id){ const b=document.getElementById(id); if(b){ b.classList.remove('speech-active'); b.textContent=t.listen; } }

  setBtn('btn-adv'); await speakSeq(adv,'advocate'); resetBtn('btn-adv'); await sleep(700);
  setBtn('btn-pros'); await speakSeq(pros,'prosecutor'); resetBtn('btn-pros'); await sleep(700);
  setBtn('btn-judge'); await speakSeq(judge,'judge'); resetBtn('btn-judge');

  if(allBtn){ allBtn.disabled=false; allBtn.textContent=t.listenAll; }
}

function stopSpeak(){
  const t=T[LANG];
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  ['btn-adv','btn-pros','btn-judge'].forEach(id=>{
    const b=document.getElementById(id);
    if(b){ b.classList.remove('speech-active'); b.textContent=t.listen; }
  });
  const allBtn=document.getElementById('playAllBtn');
  if(allBtn){ allBtn.disabled=false; allBtn.textContent=t.listenAll; }
}

// ============================================================
// 🎬 VIDEO MAKER v3.0 — AI rasm + Ken Burns + Ovoz
// ============================================================
let vCanvas, vCtx;
let vRecorder, vChunks = [];
let vScenes = [], vDur, vW, vH;
let vSceneIdx = 0, vSceneStart = 0, vAnim = null;
let vImages = [];
let vAudioCtx = null;
let vAudioStream = null;

function vSetSize(s) {
  const p = s.split('x');
  vW = parseInt(p[0]);
  vH = parseInt(p[1]);
  vCanvas.width = vW;
  vCanvas.height = vH;
}

// AI rasm yuklash
function vLoadImage(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    let done = false;
    img.onload = () => { if (!done) { done = true; resolve(img); } };
    img.onerror = () => { if (!done) { done = true; resolve(null); } };
    img.src = url;
    setTimeout(() => { if (!done) { done = true; resolve(null); } }, 20000);
  });
}

// Ovoz — yumshoq fon musiqa (Web Audio API)
function vCreateAudio() {
  try {
    vAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const dest = vAudioCtx.createMediaStreamDestination();
    vAudioStream = dest.stream;

    // 3 ta yumshoq ton (chord)
    const notes = [261.63, 329.63, 392.00]; // C, E, G
    notes.forEach((freq, i) => {
      const osc = vAudioCtx.createOscillator();
      const gain = vAudioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.value = 0.04;
      osc.connect(gain);
      gain.connect(dest);
      osc.start();
      // Yumshoq tebranish (vibrato)
      const lfo = vAudioCtx.createOscillator();
      const lfoGain = vAudioCtx.createGain();
      lfo.frequency.value = 0.5 + i * 0.2;
      lfoGain.gain.value = 1;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      lfo.start();
    });
    return vAudioStream;
  } catch(e) {
    console.log('Audio xato:', e);
    return null;
  }
}

// Ken Burns effekt bilan sahna chizish
function vDrawScene(img, text, progress, alpha, idx, total) {
  // Fon
  vCtx.fillStyle = "#000";
  vCtx.fillRect(0, 0, vW, vH);

  if (img) {
    // Ken Burns: sekin zoom + pan
    const zoom = 1 + progress * 0.20;
    const iw = vW * zoom;
    const ih = vH * zoom;
    const panX = Math.sin(progress * Math.PI) * vW * 0.04;
    const panY = Math.cos(progress * Math.PI) * vH * 0.02;
    const ix = (vW - iw) / 2 + panX;
    const iy = (vH - ih) / 2 + panY;

    vCtx.save();
    vCtx.globalAlpha = alpha;
    vCtx.drawImage(img, ix, iy, iw, ih);
    vCtx.restore();

    // Qoraytiruvchi gradient
    const grad = vCtx.createLinearGradient(0, 0, 0, vH);
    grad.addColorStop(0, 'rgba(0,0,0,0.3)');
    grad.addColorStop(0.5, 'rgba(0,0,0,0.5)');
    grad.addColorStop(1, 'rgba(0,0,0,0.75)');
    vCtx.fillStyle = grad;
    vCtx.fillRect(0, 0, vW, vH);
  } else {
    // Rasm yo'q — gradient
    const grad = vCtx.createLinearGradient(0, 0, vW, vH);
    grad.addColorStop(0, "#050510");
    grad.addColorStop(1, "#2a1a4a");
    vCtx.fillStyle = grad;
    vCtx.fillRect(0, 0, vW, vH);
  }

  // Yuqorida progress bar
  vCtx.fillStyle = 'rgba(255,255,255,0.2)';
  vCtx.fillRect(vW * 0.3, vH * 0.06, vW * 0.4, 4);
  vCtx.fillStyle = '#fbbf24';
  const totalProgress = (idx + progress) / total;
  vCtx.fillRect(vW * 0.3, vH * 0.06, vW * 0.4 * totalProgress, 4);

  // Matn — animatsiya bilan
  vCtx.save();
  // Fade + slide up
  const textProgress = Math.min(progress * 3, 1);
  const yOffset = (1 - textProgress) * 30;

  vCtx.globalAlpha = alpha * textProgress;
  vCtx.fillStyle = "#fff";
  vCtx.textAlign = "center";
  vCtx.textBaseline = "middle";

  const fontSize = Math.min(vW, vH) * 0.085;
  vCtx.font = "bold " + fontSize + "px system-ui, -apple-system, sans-serif";
  vCtx.shadowColor = "rgba(0,0,0,0.9)";
  vCtx.shadowBlur = 20;
  vCtx.shadowOffsetY = 4;

  const maxWidth = vW * 0.85;
  const words = text.split(" ");
  const lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (vCtx.measureText(test).width > maxWidth) {
      if (line) lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);

  const lineHeight = fontSize * 1.3;
  const totalHeight = lines.length * lineHeight;
  const startY = vH / 2 - totalHeight / 2 + lineHeight / 2;

  lines.forEach((l, i) => {
    vCtx.fillText(l, vW / 2, startY + i * lineHeight + yOffset);
  });
  vCtx.restore();

  // Pastda imzo
  vCtx.save();
  vCtx.globalAlpha = alpha * 0.8;
  vCtx.fillStyle = 'rgba(255,255,255,0.5)';
  vCtx.font = '500 ' + (fontSize * 0.32) + 'px system-ui, sans-serif';
  vCtx.textAlign = "center";
  vCtx.shadowBlur = 0;
  vCtx.fillText('Blip AI · 2026', vW / 2, vH * 0.92);
  vCtx.restore();
}

function vAnimate() {
  const now = Date.now();
  const sceneDur = vDur * 1000;
  const elapsed = now - vSceneStart;

  if (elapsed >= sceneDur) {
    vSceneIdx++;
    if (vSceneIdx >= vScenes.length) {
      vStop();
      return;
    }
    vSceneStart = now;
  }

  const progress = Math.min(elapsed / sceneDur, 1);
  let alpha = 1;
  if (progress < 0.12) alpha = progress / 0.12;
  else if (progress > 0.88) alpha = (1 - progress) / 0.12;

  vDrawScene(vImages[vSceneIdx], vScenes[vSceneIdx], progress, alpha, vSceneIdx, vScenes.length);
  vAnim = requestAnimationFrame(vAnimate);
}

async function vStart() {
  const t = T[LANG];
  const text = document.getElementById('vtext').value.trim();
  if (!text) { alert(t.vNoText); return; }

  vScenes = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
  if (!vScenes.length) { alert(t.vNoScenes); return; }

  vDur = parseInt(document.getElementById('vdur').value) || 3;
  vSetSize(document.getElementById('vsize').value);

  document.getElementById('vstart').disabled = true;
  document.getElementById('vdownload').style.display = 'none';
  document.getElementById('vstatus').style.display = 'block';

  // 1. Har sahnaga AI rasm yasash
  vImages = [];
  for (let i = 0; i < vScenes.length; i++) {
    document.getElementById('vstatus').innerHTML = '🎨 AI rasm ' + (i+1) + '/' + vScenes.length + '<span class="dots"></span>';
    const prompt = vScenes[i] + ", cinematic, dramatic lighting, warm colors, high quality, 4k, detailed";
    const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) + "?width=" + vW + "&height=" + vH + "&nologo=true&seed=" + (Date.now() + i * 1000);
    const img = await vLoadImage(url);
    vImages.push(img);
  }

  // 2. Ovoz tayyorlash
  document.getElementById('vstatus').innerHTML = '🎵 Ovoz tayyorlanmoqda...';
  const audioStream = vCreateAudio();

  // 3. Yozishni boshlash
  document.getElementById('vstatus').innerHTML = t.vRecording + '<span class="dots"></span>';

  const videoStream = vCanvas.captureStream(30);
  vChunks = [];

  // Ovozni videoga qo'shish
  let finalStream = videoStream;
  if (audioStream) {
    finalStream = new MediaStream();
    videoStream.getVideoTracks().forEach(tr => finalStream.addTrack(tr));
    audioStream.getAudioTracks().forEach(tr => finalStream.addTrack(tr));
  }

  let mime = 'video/webm;codecs=vp9,opus';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp8,opus';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4';

  try {
    vRecorder = new MediaRecorder(finalStream, { mimeType: mime });
  } catch(e) {
    try { vRecorder = new MediaRecorder(finalStream); }
    catch(e2) { alert('❌ Videoni yozib bo\'lmaydi: ' + e2.message); return; }
  }

  vRecorder.ondataavailable = e => { if (e.data.size > 0) vChunks.push(e.data); };
  vRecorder.onstop = () => {
    document.getElementById('vstatus').innerHTML = t.vReady;
    document.getElementById('vdownload').style.display = 'block';
    document.getElementById('vstart').disabled = false;
    // Ovozni to'xtatish
    if (vAudioCtx) { vAudioCtx.close(); vAudioCtx = null; }
  };
  vRecorder.start(1000);

  vSceneIdx = 0;
  vSceneStart = Date.now();
  if (vAnim) cancelAnimationFrame(vAnim);
  vAnimate();
}

function vStop() {
  if (vRecorder && vRecorder.state !== 'inactive') vRecorder.stop();
  if (vAnim) { cancelAnimationFrame(vAnim); vAnim = null; }
}

function vDownload() {
  if (!vChunks.length) { alert('Video tayyor emas!'); return; }
  const blob = new Blob(vChunks, { type: 'video/webm' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'blip-video-' + Date.now() + '.webm';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
