<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blip Video Maker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050510;--card:#0f0f22;--text:#e6e6f0;--muted:#8888aa;--acc:#6366f1;--acc2:#a855f7;--brd:#1f1f3a;--gold:#fbbf24;--grn:#10b981}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;background-image:radial-gradient(circle at 15% 15%,rgba(99,102,241,.15),transparent 40%),radial-gradient(circle at 85% 85%,rgba(168,85,247,.15),transparent 40%);background-attachment:fixed}
.c{max-width:700px;margin:auto}
header{text-align:center;padding:24px 0 16px}
h1{font-size:28px;font-weight:900;background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899,#f59e0b,#6366f1);background-size:400% 400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:grad 6s ease infinite}
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sub{color:var(--muted);margin-top:6px;font-size:13px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:16px;margin-bottom:14px}
.lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
textarea,input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--brd);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:10px}
textarea{min-height:80px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.btn{padding:12px 20px;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:700;font-size:14px;transition:all .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-full{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn-row .btn{flex:1;min-width:120px}
.btn-sec{background:var(--card);border:1px solid var(--brd);color:var(--text)}
.btn-gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a}
.canvas-wrap{background:#000;border-radius:12px;overflow:hidden;margin-bottom:12px;text-align:center}
canvas{max-width:100%;height:auto;display:block;margin:auto}
.loading{text-align:center;padding:20px;color:var(--muted);font-size:13px}
.dots::after{content:'...';animation:dots 1.5s steps(4) infinite}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}
.footer{text-align:center;padding:20px;color:var(--muted);font-size:11px;margin-top:20px}
.footer a{color:var(--acc);text-decoration:none}
.hint{background:rgba(99,102,241,.1);border:1px solid var(--acc);border-radius:10px;padding:10px;font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
@media(max-width:600px){h1{font-size:22px}.c{padding:6px}body{padding:8px}}
</style>
</head>
<body>
<div class="c">

<header>
  <h1>🎬 BLIP VIDEO MAKER</h1>
  <p class="sub">Matndan video yasa — bepul, brauzerda!</p>
</header>

<div class="card">
  <div class="hint">💡 Sahnani yozing — video shu matnni ko‘rsatadi. Har bir qator alohida sahna.</div>

  <label class="lbl">📝 Matn (har bir qator — yangi sahna)</label>
  <textarea id="text" placeholder="Salom, Ustoz!&#10;Sizga rahmat aytmoqchiman&#10;Siz meni o'qitdingiz&#10;Rahmat!">Salom, Ustoz! 👋&#10;&#10;Sizga rahmat aytmoqchiman 🙏&#10;&#10;Siz meni o'qitdingiz 📚&#10;&#10;Rahmat, Ustoz! 💛</textarea>

  <label class="lbl">🎨 Rang uslubi</label>
  <select id="theme">
    <option value="dark">🌙 Dark (qorong'i)</option>
    <option value="gold">✨ Gold (oltin)</option>
    <option value="blue">💙 Blue (ko'k)</option>
    <option value="purple">💜 Purple (binafsha)</option>
    <option value="sunset">🌅 Sunset (quyosh botishi)</option>
  </select>

  <label class="lbl">⏱ Har bir sahna (soniya)</label>
  <input type="number" id="dur" value="3" min="1" max="10">

  <label class="lbl">📐 O'lcham</label>
  <select id="size">
    <option value="1280x720">Landscape (1280x720)</option>
    <option value="720x1280">Portrait (720x1280)</option>
    <option value="1080x1080">Square (1080x1080)</option>
  </select>

  <button class="btn btn-full" id="startBtn" onclick="startRecording()">🎬 Videoni yasash</button>
</div>

<div class="canvas-wrap">
  <canvas id="canvas" width="1280" height="720"></canvas>
</div>

<div id="status" class="loading" style="display:none"></div>

<div id="downloadBox" style="display:none">
  <button class="btn btn-full btn-gold" onclick="downloadVideo()">📥 Videoni yuklab olish</button>
</div>

<div class="footer">⚡ <a href="index.html">Blip</a> · 2026 · Tojikiston 🇹🇯</div>

</div>

<script>
// ============================================================
// 🎨 RANG USLUBLARI
// ============================================================
const THEMES = {
  dark:   { bg1: '#050510', bg2: '#1a1a3a', text: '#e6e6f0', accent: '#6366f1' },
  gold:   { bg1: '#1a1400', bg2: '#3a2800', text: '#ffe4a0', accent: '#fbbf24' },
  blue:   { bg1: '#001428', bg2: '#002a4d', text: '#cce6ff', accent: '#06b6d4' },
  purple: { bg1: '#14002a', bg2: '#2a0050', text: '#e6ccff', accent: '#a855f7' },
  sunset: { bg1: '#1a0800', bg2: '#4d1a00', text: '#ffd9b3', accent: '#ec4899' }
};

let canvas, ctx;
let mediaRecorder, recordedChunks = [];
let scenes = [];
let theme, dur, W, H;
let currentScene = 0;
let sceneStartTime = 0;
let animFrame = null;

// ============================================================
// CANVAS O'LCHAMI
// ============================================================
function setSize(s) {
  const parts = s.split('x');
  W = parseInt(parts[0]);
  H = parseInt(parts[1]);
  canvas.width = W;
  canvas.height = H;
}

// ============================================================
// SAHNA CHIZISH
// ============================================================
function drawScene(sceneText, progress, alpha) {
  const t = theme;

  // Gradient fon
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, t.bg1);
  grad.addColorStop(1, t.bg2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Harakatlanuvchi zarralar
  const time = Date.now() / 1000;
  for (let i = 0; i < 30; i++) {
    const x = ((i * 137 + time * 30) % W);
    const y = ((i * 89 + time * 20) % H);
    const r = 2 + (i % 3);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = t.accent + '33';
    ctx.fill();
  }

  // Sarlavha chizig'i (yuqori)
  ctx.fillStyle = t.accent;
  ctx.fillRect(W * 0.35, H * 0.15, W * 0.3 * progress, 4);

  // Asosiy matn
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = t.text;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const fontSize = Math.min(W, H) * 0.09;
  ctx.font = 'bold ' + fontSize + 'px system-ui, sans-serif';

  // Matnni bo'laklarga bo'lish
  const maxWidth = W * 0.85;
  const words = sceneText.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth) {
      if (line) lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);

  const lineHeight = fontSize * 1.3;
  const totalHeight = lines.length * lineHeight;
  const startY = H / 2 - totalHeight / 2 + lineHeight / 2;

  lines.forEach((l, i) => {
    ctx.fillText(l, W / 2, startY + i * lineHeight);
  });

  ctx.restore();

  // Pastdagi imzo
  ctx.fillStyle = t.text + '88';
  ctx.font = '500 ' + (fontSize * 0.35) + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Blip · 2026', W / 2, H * 0.9);
}

// ============================================================
// ANIMATSIYA LOOP
// ============================================================
function animate() {
  const now = Date.now();
  const sceneDuration = dur * 1000;
  const elapsed = now - sceneStartTime;

  if (elapsed >= sceneDuration) {
    currentScene++;
    if (currentScene >= scenes.length) {
      stopRecording();
      return;
    }
    sceneStartTime = now;
  }

  const progress = Math.min(elapsed / sceneDuration, 1);
  // Fade in (0-0.2), fade out (0.8-1)
  let alpha = 1;
  if (progress < 0.2) alpha = progress / 0.2;
  else if (progress > 0.8) alpha = (1 - progress) / 0.2;

  drawScene(scenes[currentScene], progress, alpha);
  animFrame = requestAnimationFrame(animate);
}

// ============================================================
// YOZISHNI BOSHLASH
// ============================================================
async function startRecording() {
  const text = document.getElementById('text').value.trim();
  if (!text) {
    alert('Matn kiriting!');
    return;
  }

  // Sahnaga bo'lish — bo'sh qatorlar bilan
  scenes = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
  if (!scenes.length) {
    alert('Sahnalar bo\'sh!');
    return;
  }

  theme = THEMES[document.getElementById('theme').value] || THEMES.dark;
  dur = parseInt(document.getElementById('dur').value) || 3;
  setSize(document.getElementById('size').value);

  // Tugmani o'chirish
  document.getElementById('startBtn').disabled = true;
  document.getElementById('downloadBox').style.display = 'none';
  document.getElementById('status').style.display = 'block';
  document.getElementById('status').innerHTML = '🎬 Video yozilmoqda<span class="dots"></span>';

  // MediaRecorder
  const stream = canvas.captureStream(30); // 30 fps
  recordedChunks = [];

  let mimeType = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mimeType)) {
    mimeType = 'video/webm';
  }
  if (!MediaRecorder.isTypeSupported(mimeType)) {
    mimeType = 'video/mp4';
  }

  try {
    mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
  } catch (e) {
    mediaRecorder = new MediaRecorder(stream);
  }

  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    document.getElementById('status').innerHTML = '✅ Video tayyor!';
    document.getElementById('downloadBox').style.display = 'block';
    document.getElementById('startBtn').disabled = false;
  };

  mediaRecorder.start();

  // Animatsiyani boshlash
  currentScene = 0;
  sceneStartTime = Date.now();
  if (animFrame) cancelAnimationFrame(animFrame);
  animate();
}

// ============================================================
// YOZISHNI TO'XTATISH
// ============================================================
function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (animFrame) {
    cancelAnimationFrame(animFrame);
    animFrame = null;
  }
}

// ============================================================
// YUKLAB OLISH
// ============================================================
function downloadVideo() {
  if (!recordedChunks.length) {
    alert('Video tayyor emas!');
    return;
  }
  const blob = new Blob(recordedChunks, { type: 'video/webm' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'blip-video-' + Date.now() + '.webm';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  theme = THEMES.dark;
  W = 1280;
  H = 720;
  // Boshlang'ich ko'rinish
  drawScene('Blip Video Maker', 1, 1);
});
</script>
</body>
  </html>
