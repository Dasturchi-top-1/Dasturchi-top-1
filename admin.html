<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Blip</title>

    <!-- Guard: faqat admin JWT -->
    <style>html{visibility:hidden}</style>
    <script>
    (async function adminGuard() {
        const API_URL = "https://saytim-uchun.onrender.com";
        const token = sessionStorage.getItem('blip_jwt');

        if (!token) {
            window.location.replace('./index.html');
            return;
        }

        try {
            const res = await fetch(`${API_URL}/api/me`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.status === 401) {
                sessionStorage.removeItem('blip_jwt');
                sessionStorage.removeItem('blip_role');
                window.location.replace('./index.html');
                return;
            }

            if (!res.ok) throw new Error("Server " + res.status);

            const data = await res.json();
            if (!data.authenticated || data.role !== 'admin') {
                window.location.replace('./index.html');
                return;
            }

            document.documentElement.style.visibility = 'visible';
        } catch (e) {
            document.documentElement.style.visibility = 'visible';
            document.body.innerHTML = `
                <div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#050510;color:#fff;padding:24px;text-align:center;font-family:sans-serif;">
                    <h2>Ulanish xatosi</h2>
                    <p style="color:#888;margin:12px 0;">${e.message}</p>
                    <button onclick="location.reload()" style="padding:12px 24px;background:#6366f1;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">Qayta urinish</button>
                </div>`;
        }
    })();
    </script>

    <style>
        :root { --bg: #050510; --card: rgba(20, 20, 40, 0.8); --acc: #ef4444; --acc2: #a855f7; --text: #fff; --grn: #10b981; --muted: #8888aa; --brd: rgba(255,255,255,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; 
            background-image: radial-gradient(circle at 50% 0%, rgba(239, 68, 68, 0.15), transparent 50%);
        }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; padding-top: 10px; }
        h1 { font-size: 28px; color: var(--acc); font-weight: 900; text-shadow: 0 0 10px rgba(239,68,68,0.5); }
        .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card { 
            background: var(--card); border: 1px solid var(--brd); padding: 20px; 
            border-radius: 16px; text-align: center; backdrop-filter: blur(10px);
        }
        .stat-num { font-size: 32px; font-weight: bold; color: var(--grn); }
        .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 5px; }
        
        .list-card { 
            background: var(--card); border: 1px solid var(--brd); border-radius: 16px; 
            padding: 20px; backdrop-filter: blur(10px); margin-bottom: 20px;
        }
        .list-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .user-item { 
            padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); 
            font-size: 14px; display: flex; justify-content: space-between; align-items: center;
        }
        .user-item:last-child { border: none; }
        
        .btn { 
            display: block; width: 100%; padding: 15px; text-align: center; 
            background: #333; color: #fff; text-decoration: none; border-radius: 10px; 
            font-weight: bold; margin-top: 10px; border: none; cursor: pointer; font-size: 14px;
        }
        .btn-red { background: linear-gradient(135deg, var(--acc), #b91c1c); }
        
        .loading { text-align: center; padding: 40px; color: var(--muted); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ ADMIN CONTROL</h1>
            <p class="sub">Faqat egasi uchun maxsus hudud</p>
        </header>
        
        <div class="grid">
            <div class="stat-card">
                <div class="stat-num" id="totalUsers">-</div>
                <div class="stat-lbl">Ro'yxatdan o'tganlar</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="statusIndicator">-</div>
                <div class="stat-lbl">Server holati</div>
            </div>
        </div>

        <div class="list-card">
            <div class="list-title">📋 Foydalanuvchilar ro'yxati</div>
            <div id="userList"><div class="loading">Yuklanmoqda...</div></div>
        </div>

        <button class="btn btn-red" onclick="logout()">🚪 Chiqish (Logout)</button>
        <a href="multiverse.html" class="btn">⬅️ Saytga qaytish</a>
                                                                </div>
                                                                    <script>
        const API_URL = "https://saytim-uchun.onrender.com";

        function getToken() {
            return sessionStorage.getItem('blip_jwt');
        }

        function authHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${getToken()}`
            };
        }

        // ============= STATISTIKA =============
        async function loadStats() {
            const userListBox = document.getElementById('userList');
            const totalEl = document.getElementById('totalUsers');
            const statusEl = document.getElementById('statusIndicator');

            try {
                const res = await fetch(`${API_URL}/api/admin/stats`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({})
                });

                // 401 — token yo'q / eskirgan
                if (res.status === 401) {
                    sessionStorage.removeItem('blip_jwt');
                    sessionStorage.removeItem('blip_role');
                    window.location.replace('./index.html');
                    return;
                }

                // 403 — admin emas
                if (res.status === 403) {
                    statusEl.innerText = '403';
                    statusEl.style.color = '#ef4444';
                    userListBox.innerHTML = '<p style="color:var(--acc);text-align:center;padding:20px;">⛔ Sizda admin huquqi yo\'q</p>';
                    return;
                }

                if (!res.ok) throw new Error("Server xatosi: " + res.status);

                const data = await res.json();

                if (!data.success) throw new Error(data.error || "Noma'lum xato");

                // Ko'rsatish
                totalEl.innerText = data.total_users || 0;
                statusEl.innerText = '✅';
                statusEl.style.color = '#10b981';

                const users = data.users || [];
                if (users.length === 0) {
                    userListBox.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;font-size:13px;">Hozircha hech kim ro\'yxatdan o\'tmagan</p>';
                } else {
                    userListBox.innerHTML = users.map(u => `
                        <div class="user-item">
                            <span>👤 ${escapeHtml(u)}</span>
                            <span style="color:var(--grn);font-size:12px;">Faol</span>
                        </div>
                    `).join('');
                }

            } catch (e) {
                statusEl.innerText = '❌';
                statusEl.style.color = '#ef4444';
                userListBox.innerHTML = `<p style="color:var(--acc);text-align:center;padding:20px;">⚠️ Xatolik: ${escapeHtml(e.message)}</p>`;
            }
        }

        // ============= YORDAMCHI =============
        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // ============= LOGOUT =============
        function logout() {
            if (!confirm("Chiqishni tasdiqlaysizmi?")) return;
            sessionStorage.removeItem('blip_jwt');
            sessionStorage.removeItem('blip_role');
            window.location.replace('./index.html');
        }

        // ============= ISHGA TUSHIRISH =============
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            // Har 60 soniyada yangilash
            setInterval(loadStats, 60000);
        });
    </script>
</body>
    </html>
