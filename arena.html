<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080817">
<title>Blip Arena</title>
<style>
:root{color-scheme:dark;--bg:#080817;--panel:#14142a;--line:#292946;--text:#f4f4ff;--muted:#a4a4c2;--accent:#8b7cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;padding:18px}
main{max-width:980px;margin:0 auto}
header{padding:18px 0 22px}
h1{font-size:clamp(27px,6vw,42px);margin:0 0 8px}
p{color:var(--muted);line-height:1.55}
.panel,.answer{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
textarea{display:block;width:100%;min-height:125px;resize:vertical;background:#0d0d20;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit}
button{border:0;border-radius:11px;padding:12px 16px;background:var(--accent);color:white;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.secondary{background:#262642}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-top:14px}
.answer h2{font-size:17px;margin:0 0 12px}
.reply{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;color:#ededfa}
.status{color:var(--muted);min-height:24px;margin-top:12px}
.vote{background:#242442;margin-top:14px}
.vote[aria-pressed="true"]{background:#176b4d}
a{color:#b7adff;text-decoration:none}
footer{padding:24px 0;color:var(--muted);font-size:13px}
@media(max-width:520px){body{padding:12px}.panel,.answer{padding:13px}}
</style>
<script>
(async function(){
  const token=sessionStorage.getItem("blip_jwt");
  const headers={};
  if(token) headers.Authorization="Bearer "+token;
  try{
    const response=await fetch("https://saytim-uchun.onrender.com/api/me",{headers,credentials:"include",cache:"no-store"});
    if(response.status===401||response.status===403){
      sessionStorage.removeItem("blip_jwt");
      sessionStorage.removeItem("blip_role");
      location.replace("./index.html");
      return;
    }
    if(!response.ok) throw new Error("auth");
    document.documentElement.style.visibility="visible";
  }catch(_){
    location.replace("./index.html?auth_error=unavailable");
  }
})();
</script>
</head>
<body>
<main>
<header>
  <a href="multiverse.html">← Multiverse</a>
  <h1>⚔️ Blip Arena</h1>
  <p>Bitta savolni ikki AI modeliga yuboring va javoblarini taqqoslang. Har bir model mustaqil javob beradi.</p>
</header>
<section class="panel">
  <label for="question"><strong>Savolingiz</strong></label>
  <textarea id="question" maxlength="3000" placeholder="Masalan: Python dasturlash tilida funksiyalar nima va ular nima uchun kerak?"></textarea>
  <div class="actions">
    <button id="run">⚡ Arenalni boshlash</button>
    <button class="secondary" id="clear" type="button">Tozalash</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</section>
<section class="grid" id="results" aria-live="polite"></section>
<footer>Blip Multiverse · Blip Arena</footer>
</main>
<script>
const API="https://saytim-uchun.onrender.com";
const question=document.getElementById("question");
const run=document.getElementById("run");
const statusBox=document.getElementById("status");
const results=document.getElementById("results");
function authHeaders(){
  const headers={"Content-Type":"application/json"};
  const token=sessionStorage.getItem("blip_jwt");
  if(token) headers.Authorization="Bearer "+token;
  return headers;
}
function renderResults(items){
  results.replaceChildren();
  items.forEach(item=>{
    const card=document.createElement("article");
    card.className="answer";
    const heading=document.createElement("h2");
    heading.textContent=item.model;
    const reply=document.createElement("div");
    reply.className="reply";
    reply.textContent=item.reply||"Javob olinmadi.";
    card.append(heading,reply);
    if(item.success){
      const vote=document.createElement("button");
      vote.type="button";vote.className="vote";vote.textContent="✓ Shu javob menga ma'qul";
      vote.setAttribute("aria-pressed","false");
      vote.addEventListener("click",()=>{
        results.querySelectorAll(".vote").forEach(b=>{b.setAttribute("aria-pressed","false");b.textContent="✓ Shu javob menga ma'qul";});
        vote.setAttribute("aria-pressed","true");vote.textContent="Tanlandi ✓";
        statusBox.textContent="Tanlovingiz shu sahifada belgilandi.";
      });
      card.appendChild(vote);
    }
    results.appendChild(card);
  });
}
run.addEventListener("click",async()=>{
  const message=question.value.trim();
  if(!message){statusBox.textContent="Avval savol yozing.";question.focus();return;}
  run.disabled=true;results.replaceChildren();statusBox.textContent="⏳ AI modellar javob tayyorlamoqda...";
  try{
    const response=await fetch(API+"/api/arena",{method:"POST",headers:authHeaders(),credentials:"include",body:JSON.stringify({message})});
    const data=await response.json();
    if(response.status===401||response.status===403){sessionStorage.removeItem("blip_jwt");location.replace("./index.html");return;}
    if(!response.ok||!data.results) throw new Error(data.error||"Arena hozir javob bera olmadi.");
    renderResults(data.results);
    statusBox.textContent=data.success?"Taqqoslash tayyor. Javoblarni o‘qing va tanlang.":"Hozircha AI javoblari olinmadi.";
  }catch(error){statusBox.textContent="⚠️ "+error.message;}
  finally{run.disabled=false;}
});
document.getElementById("clear").addEventListener("click",()=>{question.value="";results.replaceChildren();statusBox.textContent="";});
</script>
</body>
</html>
