<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Blip Portal | Kirish</title>
    <style>
        :root { --bg: #050510; --card: rgba(20, 20, 40, 0.6); --acc: #6366f1; --acc2: #a855f7; --text: #fff; --muted: #94a3b8; --err: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background-color: var(--bg); color: var(--text); min-height: 100vh; 
            display: flex; justify-content: center; align-items: center; padding: 20px;
            overflow: hidden; position: relative;
        }

        .orb { position: absolute; border-radius: 50%; filter: blur(80px); z-index: -1; animation: floatOrb 10s infinite alternate ease-in-out; }
        .orb-1 { width: 300px; height: 300px; background: rgba(99, 102, 241, 0.4); top: -50px; left: -50px; }
        .orb-2 { width: 250px; height: 250px; background: rgba(168, 85, 247, 0.3); bottom: -50px; right: -50px; animation-delay: -5s; }
        @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.2); } }

        .box { 
            background: var(--card); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); 
            padding: 35px 30px; border-radius: 24px; width: 100%; max-width: 380px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(99, 102, 241, 0.1);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; position: relative;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        h2 { text-align: center; margin-bottom: 25px; font-size: 28px; font-weight: 800; }
        .gradient-text { background: linear-gradient(90deg, var(--acc), var(--acc2), #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: gradientShift 3s linear infinite; }
        @keyframes gradientShift { to { background-position: 200% center; } }

        .tabs { display: flex; gap: 5px; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 14px; margin-bottom: 25px; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--muted); transition: all 0.3s ease; }
        .tab.active { background: var(--acc); color: #fff; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        
        .input-group { margin-bottom: 18px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; font-size: 15px; outline: none; transition: all 0.3s ease; }
        input:focus { border-color: var(--acc); box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(90deg, var(--acc), var(--acc2)); color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: all 0.3s; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(99, 102, 241, 0.5); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .msg { font-size: 13px; text-align: center; margin-top: 15px; display: none; padding: 12px; border-radius: 10px; }
        .msg.err { background: rgba(239,68,68,0.1); color: var(--err); border: 1px solid rgba(239,68,68,0.3); }
        .msg.ok { background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
        
        .ai-link { display: block; text-align: center; margin-top: 25px; color: var(--muted); font-size: 13px; text-decoration: none; transition: 0.3s; }
        .ai-link:hover { color: var(--acc2); text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="box">
        <h2 class="gradient-text">Blip Portal</h2>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')" id="tab-login">Kirish</div>
            <div class="tab" onclick="switchTab('register')" id="tab-register">Ro'yxatdan o'tish</div>
        </div>
        <form id="authForm" onsubmit="handleSubmit(event)">
            <div class="input-group"><input type="text" id="username" placeholder="Ismingiz" required autocomplete="off"></div>
            <div class="input-group"><input type="password" id="password" placeholder="Parolingiz" required></div>
            <button type="submit" class="btn" id="submitBtn">Kirish</button>
        </form>
        <div class="msg" id="msgBox"></div>
        <a href="ai_login.html" class="ai-link">🤖 Sun'iy Intellekt sifatida kirish</a>
    </div>

    <script>
        const API_URL = "https://saytim-uchun.onrender.com"; // Manzilingiz
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + mode).classList.add('active');
            document.getElementById('submitBtn').innerText = mode === 'login' ? "Kirish" : "Ro'yxatdan o'tish";
            document.getElementById('msgBox').style.display = 'none';
        }

        function showMsg(text, type = 'err') {
            const msg = document.getElementById('msgBox');
            msg.innerText = text;
            msg.className = "msg " + type;
            msg.style.display = 'block';
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true; btn.innerText = "Tekshirilmoqda...";
            showMsg("Server uyg'onmoqda, kuting...", "ok");

            const slowTimer = setTimeout(() => { showMsg("⏳ Render uyg'onmoqda... (50 soniyagacha kutish mumkin)", "ok"); }, 5000);
            const endpoint = currentMode === 'login' ? '/api/login' : '/api/register';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);

                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }), signal: controller.signal
                });
                clearTimeout(timeoutId); clearTimeout(slowTimer);
                const data = await res.json();

                if (data.success) {
                    if (currentMode === 'register') {
                        showMsg("✅ Muvaffaqiyatli ro'yxatdan o'tdingiz! Endi kiring.", "ok");
                        switchTab('login'); btn.disabled = false; btn.innerText = "Kirish";
                    } else {
                        localStorage.setItem('blip_token', data.token);
                        localStorage.setItem('blip_role', data.role);
                        showMsg("✅ Muvaffaqiyatli kirdingiz!", "ok");
                        setTimeout(() => window.location.href = data.redirect, 800);
                    }
                } else {
                    showMsg("❌ " + (data.error || "Xatolik"));
                    btn.disabled = false; btn.innerText = currentMode === 'login' ? "Kirish" : "Ro'yxatdan o'tish";
                }
            } catch (err) {
                clearTimeout(slowTimer);
                showMsg("⚠️ Server bilan aloqa yo'q!");
                btn.disabled = false; btn.innerText = currentMode === 'login' ? "Kirish" : "Ro'yxatdan o'tish";
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('blip_token');
            if (token) {
                try {
                    const res = await fetch(`${API_URL}/api/verify-token`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
                    const data = await res.json();
                    if (data.valid) window.location.href = 'multiverse.html'; else localStorage.removeItem('blip_token');
                } catch (e) {}
            }
        });
    </script>
</body>
                                         </html>
