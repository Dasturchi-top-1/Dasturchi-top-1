<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blip Portal | Kirish</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://saytim-uchun.onrender.com; base-uri 'none'; form-action 'none'; object-src 'none'">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050510">
    <script>
        /* Boshqa sayt bu sahifani ramka ichiga solib aldamasligi uchun */
        if (window.top !== window.self) {
            document.documentElement.style.display = 'none';
            try { window.top.location.href = window.self.location.href; } catch (_) {}
        }
    </script>
    <style>
        :root { --bg:#050510; --acc:#6366f1; --acc2:#a855f7; --text:#fff; --muted:#94a3b8; --err:#ef4444; --ok:#10b981; --glow:#ffe9a8; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
        [hidden] { display:none !important; }
        body { background:var(--bg); color:var(--text); min-height:100vh; min-height:100dvh; overflow-x:hidden; }

        /* Fon: yengil, harakatsiz gradientlar (telefon qotmasligi uchun filtr va blur yo'q) */
        .bg { position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.15; transition:opacity 1.2s;
              background: radial-gradient(circle at 12% 8%, rgba(99,102,241,.45), transparent 42%),
                          radial-gradient(circle at 90% 95%, rgba(168,85,247,.38), transparent 40%),
                          radial-gradient(ellipse at 50% 0%, #1d1d44, transparent 62%); }
        body.lit .bg { opacity:1; }

        .scene { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:0 16px 36px; }

        /* ===== CHIROQ ===== */
        .lamp-wrap { position:relative; width:200px; height:230px; flex:none; }
        .swing { position:absolute; inset:0; transform-origin:50% 0; will-change:transform; animation:swing 5s ease-in-out infinite; }
        body.lit .swing { animation:settle 2.4s ease-out forwards; }
        @keyframes swing { 0%,100% { transform:rotate(-2.2deg); } 50% { transform:rotate(2.2deg); } }
        @keyframes settle { from { transform:rotate(7deg); } 30% { transform:rotate(-4deg); } 60% { transform:rotate(2deg); } to { transform:rotate(0); } }
        .wire { position:absolute; left:50%; top:0; width:2px; height:46px; background:#3b3b55; transform:translateX(-50%); }
        .lamp { position:absolute; left:0; top:44px; width:200px; height:140px; }
        .bulb { fill:#2c2c40; transition:fill .25s; }
        body.lit .bulb { fill:#fff6cf; }
        /* Yorug'lik "nuri": filtr o'rniga oddiy gradient doira */
        .glow { position:absolute; left:50%; top:138px; width:170px; height:170px; margin:-85px 0 0 -85px; border-radius:50%; opacity:0; pointer-events:none; transition:opacity .35s;
                background:radial-gradient(circle, rgba(255,233,168,.6), rgba(255,233,168,0) 66%); }
        body.lit .glow { opacity:1; animation:flick .8s linear 1; }
        @keyframes flick { 0% { opacity:.1; } 12% { opacity:1; } 22% { opacity:.2; } 38% { opacity:1; } 48% { opacity:.4; } 62%,100% { opacity:1; } }

        /* IP: yuqori uchi chiroqqa mahkam bog'langan, pastga CHO'ZILADI */
        .cord { position:absolute; left:134px; top:122px; width:32px; height:104px; background:none; border:0; padding:0; cursor:grab; border-radius:10px;
                display:flex; flex-direction:column; align-items:center;
                touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
        .cord:focus-visible { outline:2px solid var(--acc2); outline-offset:3px; }
        .cord-line { width:2px; height:64px; background:#7a7a9c; transform-origin:50% 0; transform:scaleY(var(--k,1)); transition:transform .3s cubic-bezier(.3,1.6,.5,1); }
        .cord-knob { width:16px; height:16px; border-radius:50%; background:var(--glow); box-shadow:0 0 8px rgba(255,233,168,.7); transform:translateY(var(--pull,0px)); transition:transform .3s cubic-bezier(.3,1.6,.5,1); }
        .cord.drag { cursor:grabbing; }
        .cord.drag .cord-line, .cord.drag .cord-knob { transition:none; }
        .cord.pulled .cord-line { animation:tugLine .4s; }
        .cord.pulled .cord-knob { animation:tugKnob .4s; }
        @keyframes tugLine { 40% { transform:scaleY(1.4); } }
        @keyframes tugKnob { 40% { transform:translateY(26px); } }

        /* Yorug'lik konusi: bitta statik SVG, faqat opacity o'zgaradi */
        .cone { position:absolute; left:50%; top:128px; width:min(94vw,540px); height:360px; transform:translateX(-50%); pointer-events:none; opacity:0; transition:opacity .9s .15s; }
        body.lit .cone { opacity:1; }

        .hint { color:var(--muted); font-size:14px; text-align:center; margin:2px 0 8px; }
        body.lit .hint { display:none; }

        /* ===== KARTA ===== */
        .box { position:relative; z-index:1; width:100%; max-width:380px; background:rgba(18,18,38,.94); border:1px solid rgba(255,255,255,.08); padding:28px 24px; border-radius:24px; box-shadow:0 14px 36px rgba(0,0,0,.5);
               opacity:0; transform:translateY(22px); pointer-events:none; transition:opacity .6s .3s, transform .6s .3s cubic-bezier(.2,.8,.2,1); }
        body.lit .box { opacity:1; transform:none; pointer-events:auto; }
        h2 { text-align:center; margin-bottom:10px; font-size:26px; font-weight:800; }
        .gradient-text { background:linear-gradient(90deg,var(--acc),var(--acc2),#ec4899); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .sub { color:var(--muted); font-size:14px; line-height:1.5; text-align:center; margin-bottom:18px; }
        .note { color:var(--muted); font-size:12px; line-height:1.5; text-align:center; margin-top:4px; }
        .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
        .msg { font-size:13px; text-align:center; margin-bottom:12px; display:none; padding:12px; border-radius:10px; }
        .msg.err { display:block; background:rgba(239,68,68,.1); color:var(--err); border:1px solid rgba(239,68,68,.3); }
        .msg.ok { display:block; background:rgba(16,185,129,.1); color:var(--ok); border:1px solid rgba(16,185,129,.3); }
        .oauth-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:15px; border-radius:12px; text-decoration:none; font-weight:700; font-size:15px; margin-bottom:12px; border:1px solid transparent; -webkit-tap-highlight-color:transparent; }
        .oauth-btn:active { transform:scale(.98); }
        .google-btn { background:#fff; color:#333; }
        .github-btn { background:#24292e; color:#fff; border-color:#444; }
        .ai-link { display:block; text-align:center; margin-top:16px; color:var(--muted); font-size:13px; text-decoration:none; }
        .ai-link:hover { color:var(--acc2); }

        /* Admin (faqat saytmanzil oxirida #admin bo'lsa ko'rinadi) */
        .admin { margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,.08); }
        .admin input { width:100%; padding:13px; margin-bottom:10px; border-radius:12px; border:1px solid rgba(255,255,255,.1); background:rgba(0,0,0,.3); color:#fff; font-size:16px; outline:none; }
        .admin button { width:100%; padding:13px; border:0; border-radius:12px; background:linear-gradient(90deg,var(--acc),var(--acc2)); color:#fff; font-weight:700; font-size:15px; }
        .admin button:disabled { opacity:.6; }

        /* Muvaffaqiyatli kirishda yorug'lik chaqnashi */
        .flash-layer { position:fixed; inset:0; z-index:9; pointer-events:none; opacity:0; background:radial-gradient(circle at 50% 18%, #fff 0%, rgba(255,233,168,.85) 25%, rgba(255,233,168,0) 70%); }
        body.flash .flash-layer { animation:flashIn .8s ease-out forwards; }
        @keyframes flashIn { 0% { opacity:0; } 45% { opacity:1; } 100% { opacity:.9; } }

        .g-mark { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:#4285f4; color:#fff; font-weight:800; font-size:12px; }
        .desk { display:none; }
        .srv { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:5; font-size:12px; color:var(--muted); background:rgba(18,18,38,.9); border:1px solid rgba(255,255,255,.08); padding:6px 12px; border-radius:999px; pointer-events:none; }

        /* ===== Kompyuter rejimi ===== */
        @media (min-width: 900px) {
            .scene { padding-top: 28px; }
            .lamp-wrap { transform: scale(1.25); transform-origin: 50% 0; margin-bottom: 58px; }
            .hint { font-size: 15px; }
            .box { max-width: 440px; padding: 34px 32px; }
            h2 { font-size: 30px; }
            .oauth-btn { padding: 16px; font-size: 16px; transition: transform .15s, filter .15s; }
            .oauth-btn:hover { transform: translateY(-1px); filter: brightness(.95); }
        }
        @media (hover: hover) and (pointer: fine) { .desk { display: inline; } }
        /* Past va keng ekran (telefon yotiq holatda) */
        @media (max-height: 600px) and (orientation: landscape) {
            .lamp-wrap { transform: scale(.7); transform-origin: 50% 0; margin-bottom: -69px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation:none !important; transition-duration:.01ms !important; transition-delay:0s !important; }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="flash-layer"></div>

    <main class="scene">
        <div class="lamp-wrap">
            <svg class="cone" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                <defs><linearGradient id="coneGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".30"/><stop offset=".88" stop-color="#ffe9a8" stop-opacity="0"/></linearGradient></defs>
                <polygon points="41,0 59,0 100,100 0,100" fill="url(#coneGrad)"/>
            </svg>
            <div class="swing">
                <div class="wire"></div>
                <svg class="lamp" viewBox="0 0 200 140" aria-hidden="true">
                    <defs><linearGradient id="shadeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b4b73"/><stop offset="1" stop-color="#242440"/></linearGradient></defs>
                    <path d="M38 78 L70 6 H130 L162 78 Z" fill="url(#shadeGrad)"/>
                    <rect x="36" y="76" width="128" height="7" rx="3.5" fill="#34345a"/>
                    <circle class="bulb" cx="100" cy="94" r="12"/>
                </svg>
                <div class="glow"></div>
                <button class="cord" id="cord" type="button" aria-pressed="false" aria-label="Chiroqni yoqish (torting yoki bosing)">
                    <span class="cord-line"></span><span class="cord-knob"></span>
                </button>
            </div>
        </div>
        <p class="hint" id="hint">💡 Kirish uchun chiroq ipini torting<span class="desk"> (yoki ip ustida Enter bosing)</span></p>

        <section class="box" id="box" inert aria-hidden="true">
            <h2 class="gradient-text">Blip Portal</h2>
            <p class="sub">Google yoki GitHub hisobingiz bilan kiring. Ism va parol kerak emas.</p>

            <div class="msg" id="msgBox" role="status" aria-live="polite"></div>

            <a href="https://saytim-uchun.onrender.com/api/auth/google" class="oauth-btn google-btn" id="googleBtn">
                <span class="g-mark" aria-hidden="true">G</span>
                <span>Google bilan kirish</span>
            </a>
            <a href="https://saytim-uchun.onrender.com/api/auth/github" class="oauth-btn github-btn" id="githubBtn">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                <span>GitHub bilan kirish</span>
            </a>
            <p class="note">Faqat ismingiz va emailingiz o'qiladi. Parolingiz bizga ko'rinmaydi.</p>

            <a href="ai_login.html" class="ai-link">🤖 Sun'iy Intellekt sifatida kirish</a>

            <form class="admin" id="adminForm" hidden novalidate>
                <label class="sr" for="adminUser">Admin ismi</label>
                <input type="text" id="adminUser" placeholder="Admin ismi" autocomplete="username" maxlength="64">
                <label class="sr" for="adminPass">Admin paroli</label>
                <input type="password" id="adminPass" placeholder="Admin paroli" autocomplete="current-password" maxlength="200">
                <button type="submit" id="adminBtn">Admin kirishi</button>
            </form>
        </section>
        <div class="srv" id="srv" role="status" aria-live="polite" hidden></div>
        <noscript><p class="hint">Kirish uchun JavaScript yoqilgan bo'lishi kerak.</p></noscript>
    </main>
    <script>
        const API_URL = "https://saytim-uchun.onrender.com";
        const $ = id => document.getElementById(id);
        const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let lit = false, busy = false;

        function showMsg(text, type = 'err') {
            const m = $('msgBox');
            m.textContent = text;           // faqat textContent: XSS xavfi yo'q
            m.className = 'msg ' + type;
        }

        // ===== Chiroq =====
        function setLamp(on) {
            lit = on;
            document.body.classList.toggle('lit', on);
            $('box').inert = !on;
            $('box').setAttribute('aria-hidden', String(!on));
            $('cord').setAttribute('aria-pressed', String(on));
            $('cord').setAttribute('aria-label', on ? "Chiroqni o'chirish" : "Chiroqni yoqish (torting yoki bosing)");
        }
        function toggleLamp() {
            const c = $('cord');
            c.classList.remove('pulled'); void c.offsetWidth; c.classList.add('pulled');
            setLamp(!lit);
        }

        // Ip: sudrash (sichqoncha/barmoq) va klaviatura. Yuqori uchi qotib turadi, ip cho'ziladi.
        (function initCord() {
            const c = $('cord');
            const LINE = 64, MAX = 40;
            let startY = null, pending = 0, raf = 0, scale = 1;
            const paint = () => {
                raf = 0;
                c.style.setProperty('--pull', pending + 'px');
                c.style.setProperty('--k', String(1 + pending / LINE));
            };
            const reset = () => {
                startY = null; pending = 0;
                if (raf) { cancelAnimationFrame(raf); raf = 0; }
                c.classList.remove('drag');
                c.style.removeProperty('--pull'); c.style.removeProperty('--k');
            };
            c.addEventListener('pointerdown', e => {
                startY = e.clientY; pending = 0;
                // Kompyuter rejimida chiroq kattalashgan: ekran pikseli -> ichki piksel
                scale = (c.offsetHeight && c.getBoundingClientRect().height / c.offsetHeight) || 1;
                c.classList.add('drag');
                try { c.setPointerCapture(e.pointerId); } catch (_) {}
            });
            c.addEventListener('pointermove', e => {
                if (startY === null) return;
                pending = Math.max(0, Math.min(MAX, (e.clientY - startY) / scale));
                if (!raf) raf = requestAnimationFrame(paint);
            });
            c.addEventListener('pointerup', () => { if (startY === null) return; reset(); toggleLamp(); });
            c.addEventListener('pointercancel', reset);
            c.addEventListener('lostpointercapture', reset);
            c.addEventListener('contextmenu', e => e.preventDefault());   // uzoq bosishda menyu chiqmasin
            c.addEventListener('click', e => { if (e.detail === 0) toggleLamp(); });   // klaviatura
        })();

        // ===== Google / GitHub tugmalari =====
        function oauthClick(name) {
            showMsg(name + "'ga o'tilmoqda... Server uyg'onayotgan bo'lsa, 50 soniyagacha kuting.", 'ok');
        }
        $('googleBtn').addEventListener('click', () => oauthClick('Google'));
        $('githubBtn').addEventListener('click', () => oauthClick('GitHub'));

        // ===== Admin kirishi =====
        // Admin formasi ochiladi: manzil oxirida #admin bo'lsa YOKI admin.html dan qaytarilgan bo'lsa.
        function safeRedirect(r) { return /^[A-Za-z0-9_\-]+\.html$/.test(String(r)) ? r : 'multiverse.html'; }
        function cameFromAdmin() {
            try {
                const u = new URL(document.referrer);
                return u.origin === location.origin && /\/admin\.html$/.test(u.pathname);
            } catch (_) { return false; }
        }
        const bounced = cameFromAdmin();
        const wantAdmin = location.hash === '#admin' || bounced;
        if (wantAdmin) { $('adminForm').hidden = false; setLamp(true); }

        // Brauzer tomonidagi yordamchi to'siq (haqiqiy limit serverda bo'lishi kerak)
        let fails = 0;
        $('adminForm').addEventListener('submit', async e => {
            e.preventDefault();
            if (busy) return;
            const username = $('adminUser').value.trim(), password = $('adminPass').value;
            if (!username || !password) { showMsg("Ism va parolni kiriting"); return; }
            busy = true; $('adminBtn').disabled = true;
            showMsg("Tekshirilmoqda...", 'ok');
            try {
                const res = await fetch(API_URL + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                const data = await res.json().catch(() => ({}));
                if (data.success && data.token && data.role === 'admin') {
                    sessionStorage.setItem('blip_jwt', data.token);
                    sessionStorage.setItem('blip_role', 'admin');
                    document.body.classList.add('flash');
                    // Admin to'g'ridan-to'g'ri admin panelga o'tadi (shu varaqda: sessionStorage saqlanadi)
                    setTimeout(() => { location.href = 'admin.html'; }, REDUCED ? 300 : 800);
                    return;
                }
                fails++;
                showMsg(data.error || "Kirish rad etildi");
                if (fails >= 5) {
                    showMsg("Juda ko'p xato urinish. 60 soniya kuting.");
                    setTimeout(() => { fails = 0; $('adminBtn').disabled = false; busy = false; }, 60000);
                    return;
                }
            } catch (_) { showMsg("Server bilan aloqa yo'q!"); }
            busy = false; $('adminBtn').disabled = false;
        });

        // ===== Boshlanish =====
        window.addEventListener('DOMContentLoaded', async () => {
            if (REDUCED) setLamp(true);

            // Server uyg'onish ko'rsatkichi (Render bepul rejasida birinchi so'rov sekin)
            const srv = $('srv');
            const slowTimer = setTimeout(() => { srv.textContent = "⏳ Server uyg'onmoqda..."; srv.hidden = false; }, 3000);
            const serverReady = () => {
                clearTimeout(slowTimer);
                if (!srv.hidden) { srv.textContent = "🟢 Server tayyor"; setTimeout(() => { srv.hidden = true; }, 2000); }
            };

            // Mavjud sessiyani tekshirish (avvalgi mantiq saqlangan)
            const token = sessionStorage.getItem('blip_jwt');
            const headers = {};
            if (token) headers['Authorization'] = `Bearer ${token}`;
            try {
                const res = await fetch(`${API_URL}/api/me`, { method: 'GET', headers, credentials: 'include' });
                serverReady();
                if (res.ok) {
                    const data = await res.json();
                    if (data.authenticated) {
                        // Admin panel uchun kelgan admin -> admin.html; qaytarib yuborilgan bo'lsa takrorlamaymiz
                        if (wantAdmin && data.role === 'admin' && !bounced) window.location.href = 'admin.html';
                        else if (!wantAdmin || data.role !== 'admin') window.location.href = 'multiverse.html';
                    }
                } else if (res.status === 401 && token) {
                    sessionStorage.removeItem('blip_jwt');
                    sessionStorage.removeItem('blip_role');
                }
            } catch (e) {
                serverReady();
                console.log("Sessiya tekshiruvi:", e.message);
            }
        });
    </script>
</body>
</html>
