<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blip | Kirish</title>
    <style>
        :root { --bg: #0b0f19; --card: rgba(22, 30, 49, 0.7); --acc: #6366f1; --acc2: #a855f7; --text: #fff; --muted: #94a3b8; --err: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; background-image: radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%); }
        .box { background: var(--card); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; width: 100%; max-width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        h2 { text-align: center; margin-bottom: 20px; background: linear-gradient(90deg, var(--acc), var(--acc2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 26px; }
        .tabs { display: flex; gap: 5px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 12px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); transition: 0.3s; }
        .tab.active { background: var(--acc); color: #fff; }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; font-size: 15px; outline: none; }
        input:focus { border-color: var(--acc); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(90deg, var(--acc), var(--acc2)); color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }
        .msg { font-size: 13px; text-align: center; margin-top: 15px; display: none; padding: 10px; border-radius: 8px; }
        .msg.err { background: rgba(239,68,68,0.1); color: var(--err); border: 1px solid rgba(239,68,68,0.3); }
        .msg.ok { background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
        .ai-link { display: block; text-align: center; margin-top: 20px; color: var(--muted); font-size: 13px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Blip Portal</h2>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')" id="tab-login">Kirish</div>
            <div class="tab" onclick="switchTab('register')" id="tab-register">Ro'yxatdan o'tish</div>
        </div>
        <form id="authForm" onsubmit="handleSubmit(event)">
            <div class="input-group"><input type="text" id="username" placeholder="Ismingiz" required autocomplete="off"></div>
            <div class="input-group"><input type="password" id="password" placeholder="Parolingiz" required></div>
            <button type="submit" class="btn" id="submitBtn">Kirish</button>
        </form>
        <div class="msg" id="msgBox"></div>
        <a href="ai_login.html" class="ai-link">🤖 Sun'iy Intellekt sifatida kirish</a>
    </div>
    <script>
        const API_URL = "https://blip-backend.onrender.com"; // RENDER HAVOLANGIZNI QO'YING
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + mode).classList.add('active');
            document.getElementById('submitBtn').innerText = mode === 'login' ? "Kirish" : "Ro'yxatdan o'tish";
            document.getElementById('msgBox').style.display = 'none';
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msgBox');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true; btn.innerText = "Tekshirilmoqda..."; msg.style.display = 'none';
            const endpoint = currentMode === 'login' ? '/api/login' : '/api/register';

            try {
                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    if (currentMode === 'register') {
                        msg.innerText = "Muvaffaqiyatli ro'yxatdan o'tdingiz! Endi kiring.";
                        msg.className = "msg ok"; msg.style.display = 'block';
                        switchTab('login'); btn.disabled = false; btn.innerText = "Kirish";
                    } else {
                        localStorage.setItem('blip_token', data.token);
                        localStorage.setItem('blip_role', data.role);
                        msg.innerText = "Muvaffaqiyatli kirdingiz!"; msg.className = "msg ok"; msg.style.display = 'block';
                        setTimeout(() => window.location.href = data.redirect, 800);
                    }
                } else {
                    msg.innerText = data.error || "Xatolik"; msg.className = "msg err"; msg.style.display = 'block';
                    btn.disabled = false; btn.innerText = currentMode === 'login' ? "Kirish" : "Ro'yxatdan o'tish";
                }
            } catch (err) {
                msg.innerText = "Server bilan aloqa yo'q!"; msg.className = "msg err"; msg.style.display = 'block';
                btn.disabled = false; btn.innerText = currentMode === 'login' ? "Kirish" : "Ro'yxatdan o'tish";
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('blip_token');
            if (token) {
                try {
                    const res = await fetch(`${API_URL}/api/verify-token`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
                    const data = await res.json();
                    if (data.valid) window.location.href = 'multiverse.html'; else localStorage.removeItem('blip_token');
                } catch (e) {}
            }
        });
    </script>
</body>
</html>
