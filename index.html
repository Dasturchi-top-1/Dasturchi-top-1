<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050510;--card:#0f0f22;--text:#e6e6f0;--muted:#8888aa;
  --accent:#6366f1;--accent2:#a855f7;--border:#1f1f3a;
  --gold:#fbbf24;--pink:#ec4899;--green:#10b981;--cyan:#06b6d4;
}
[data-theme="light"]{
  --bg:#f5f5fb;--card:#fff;--text:#111827;--muted:#6b7280;
  --accent:#4f46e5;--accent2:#9333ea;--border:#e5e7eb;
}
*{transition:background .3s,color .3s,border-color .3s}
body{
  font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.6;
  background-image:
    radial-gradient(circle at 15% 10%,rgba(99,102,241,.15),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(168,85,247,.15),transparent 40%);
  background-attachment:fixed;
}
.container{max-width:900px;margin:auto;padding:20px}
nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:10;
  border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap;
}
.logo{
  font-weight:800;font-size:18px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.nav-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lang-switch{
  display:flex;gap:3px;background:var(--card);
  padding:4px;border-radius:10px;border:1px solid var(--border);
}
.lang-btn{
  padding:5px 9px;border:none;border-radius:7px;cursor:pointer;
  background:transparent;color:var(--muted);font-weight:700;
  font-size:11px;transition:all .2s;font-family:inherit;
}
.lang-btn:hover{color:var(--text)}
.lang-btn.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
}
.theme-btn{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:6px 10px;border-radius:8px;cursor:pointer;font-size:14px;
}
header{text-align:center;padding:50px 20px 40px}
.avatar{
  width:120px;height:120px;border-radius:50%;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2),var(--pink));
  display:flex;align-items:center;justify-content:center;
  font-size:56px;font-weight:900;color:#fff;
  box-shadow:0 0 60px rgba(99,102,241,.5);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{
  font-size:52px;font-weight:900;
  background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899,#f59e0b,#6366f1);
  background-size:400% 400%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:grad 6s ease infinite;
}
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.subtitle{color:var(--muted);font-size:16px;margin-top:10px}
.badges{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.badge{
  font-size:12px;padding:6px 14px;border-radius:999px;
  background:var(--card);border:1px solid var(--border);color:var(--muted);
}
section{padding:36px 0}
h2{font-size:26px;margin-bottom:20px;text-align:center;font-weight:800}
.about{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:24px;font-size:15px;line-height:1.8;
}
.about-row{display:flex;gap:10px;margin:8px 0;flex-wrap:wrap}
.about-row b{color:var(--accent);min-width:120px}
.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:14px;
}
.project{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:20px;text-decoration:none;color:var(--text);
  transition:all .3s;display:block;position:relative;overflow:hidden;
}
.project:hover{
  transform:translateY(-6px);border-color:var(--accent);
  box-shadow:0 16px 32px rgba(99,102,241,.3);
}
.project-ico{
  font-size:36px;display:block;margin-bottom:10px;
  transition:transform .3s;
}
.project:hover .project-ico{transform:scale(1.15) rotate(-5deg)}
.project h3{font-size:16px;margin-bottom:6px}
.project p{font-size:12px;color:var(--muted);line-height:1.5}
.project .tag{
  display:inline-block;margin-top:10px;font-size:10px;
  padding:2px 8px;border-radius:999px;
  background:rgba(99,102,241,.2);color:var(--accent);
  border:1px solid var(--accent);
}
.project.hot .tag{
  background:rgba(16,185,129,.2);color:var(--green);
  border-color:var(--green);
}
.project.voice .tag{
  background:rgba(6,182,212,.2);color:var(--cyan);
  border-color:var(--cyan);
}
.skills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.skill{
  background:var(--card);border:1px solid var(--border);
  padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;
}
.skill:hover{border-color:var(--accent);color:var(--accent)}
.contact{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.contact a{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 20px;text-decoration:none;color:var(--text);font-weight:600;
  transition:all .3s;
}
.contact a:hover{border-color:var(--accent);transform:translateY(-3px)}
.contact span{font-size:20px}
footer{
  text-align:center;padding:30px 20px;color:var(--muted);
  font-size:12px;border-top:1px solid var(--border);margin-top:30px;
}
footer a{color:var(--accent);text-decoration:none}
@media(max-width:600px){
  h1{font-size:34px}
  .avatar{width:90px;height:90px;font-size:42px}
  header{padding:40px 16px 30px}
  h2{font-size:20px}
  .lang-btn{padding:4px 7px;font-size:10px}

</style>

let LANG = localStorage.getItem('blip_lang') || 'uz';

function setLang(l){
  LANG = l;
  localStorage.setItem('blip_lang', l);
  localStorage.setItem('ai_lang', l);
  applyLang();
}

function applyLang(){
  const t = T[LANG];
  document.documentElement.lang = LANG === 'tj' ? 'tg' : LANG;

  ['uz','ru','en','tj'].forEach(l => {
    const btn = document.getElementById('lang' + l.toUpperCase());
    if(btn) btn.classList.toggle('on', l === LANG);
  });

  document.title = LANG === 'tj' ? 'Blip — барномасози 13-сола'
                 : LANG === 'ru' ? 'Blip — 13-летний программист'
                 : LANG === 'en' ? 'Blip — 13-year-old developer'
                 : 'Blip — 13 yoshli dasturchi';

  document.getElementById('subtitle').textContent = t.subtitle;
  document.getElementById('h-about').textContent = t.hAbout;
  document.getElementById('h-projects').textContent = t.hProjects;
  document.getElementById('h-skills').textContent = t.hSkills;
  document.getElementById('h-contact').textContent = t.hContact;
  document.getElementById('footer').innerHTML = t.footer;

  document.getElementById('aboutBox').innerHTML = t.about
    .map(function(item){ return '<div class="about-row"><b>' + item[0] + ':</b> ' + item[1] + '</div>'; })
    .join('');

  document.getElementById('projectsBox').innerHTML = t.projects
    .map(function(p){
      var target = p.url.indexOf('http') === 0 ? 'target="_blank"' : '';
      return '<a class="project ' + (p.cls || '') + '" href="' + p.url + '" ' + target + '>' +
        '<span class="project-ico">' + p.ico + '</span>' +
        '<h3>' + p.name + '</h3>' +
        '<p>' + p.desc + '</p>' +
        '<span class="tag">' + p.tag + '</span>' +
      '</a>';
    })
    .join('');
}

// ============================================================
// 🎨 MAVZU
// ============================================================
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const nxt = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nxt);
  document.getElementById('themeBtn').textContent = nxt === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('blip_theme', nxt);
}

// ============================================================
// 🎬 INIT
// ============================================================
window.addEventListener('DOMContentLoaded', function(){
  const t = localStorage.getItem('blip_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
  applyLang();
});
